<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lakewood Chevrolet — Unit Sales Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #001f5c;
    --navy-light: #003087;
    --panel: #072055;
    --white: #ffffff;
    --grey: #9aa7c7;
    --grey-dim: #2c407e;
    --gold: #e8b923;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--navy);
    background-image:
      radial-gradient(circle at 50% 38%, rgba(255,255,255,0.05), transparent 60%),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 70px);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* top accent stripe, matches brand colors */
  .stripe {
    height: 0.7vh;
    width: 100%;
    background: linear-gradient(90deg, var(--navy-light) 0%, var(--navy-light) 50%, var(--gold) 50%, var(--gold) 100%);
    flex-shrink: 0;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2.2vh 3.2vw 0 3.2vw;
    flex-shrink: 0;
  }

  .logo-mark {
    display: flex;
    align-items: center;
    gap: 0.6vw;
  }

  .logo-mark img {
    height: 4.2vh;
    width: auto;
    display: block;
  }

  .event-meta {
    text-align: right;
    font-family: 'Oswald', sans-serif;
  }

  .event-meta .name {
    font-size: 1.9vh;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--white);
  }

  .event-meta .dates {
    font-size: 1.3vh;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--grey);
    margin-top: 0.3vh;
  }

  /* center stage */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 0 2vw;
  }

  .unit-label {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 2.8vh;
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5vh;
    padding-left: 0.55em; /* optically re-center after letter-spacing */
  }

  .big-number {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 42vh;
    line-height: 0.9;
    color: var(--white);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 6vh rgba(255,255,255,0.08);
  }

  .of-goal {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 2.4vh;
    color: var(--grey);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 0.5vh;
  }

  .of-goal span { color: var(--white); font-weight: 700; }

  /* bottom progress + status */
  .footer-zone {
    flex-shrink: 0;
    padding: 0 4vw 3vh 4vw;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 2vw;
  }

  .progress-track {
    flex: 1;
    height: 9vh;
    background: var(--panel);
    border: 2px solid var(--grey-dim);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), #ffd869);
    border-radius: 999px;
    box-shadow: 0 0 2vh rgba(232, 185, 35, 0.5);
    transition: width 1.1s cubic-bezier(0.65, 0, 0.35, 1);
  }

  .remaining-pill {
    flex-shrink: 0;
    display: inline-flex;
    align-items: baseline;
    gap: 0.8vw;
    background: var(--panel);
    border: 2px solid var(--gold);
    border-radius: 999px;
    padding: 2.2vh 2.2vw;
  }

  .remaining-pill .num {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 5.2vh;
    color: var(--gold);
  }

  .remaining-pill .txt {
    font-size: 2vh;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--grey);
  }

  .status-row {
    margin-top: 1.6vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6vw;
    font-size: 1.2vh;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--grey);
  }

  .dot {
    width: 0.9vh;
    height: 0.9vh;
    border-radius: 50%;
    background: #3ecf5e;
    box-shadow: 0 0 1vh rgba(62, 207, 94, 0.7);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  @media (prefers-reduced-motion: reduce) {
    .progress-fill { transition: none; }
    .dot { animation: none; }
  }
</style>
</head>
<body>

<div class="stripe"></div>

<div class="header">
  <div class="logo-mark">
    <img src="https://canadaoneprod-com.cdn-convertus.com/uploads/sites/105/2025/07/lwc_logo-logo-full-color-rgb-Torie-Zdan-neg-full.png" alt="Lakewood Chevrolet logo">
  </div>
  <div class="event-meta">
    <div class="name">New Store. New Goals.</div>
    <div class="dates">Only in September</div>
  </div>
</div>

<div class="stage">
  <div class="unit-label">Units Sold</div>
  <div class="big-number" id="bigNumber">0</div>
  <div class="of-goal">of <span id="goalDisplay">0</span> goal</div>
</div>

<div class="footer-zone">
  <div class="progress-row">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="remaining-pill">
      <span class="num" id="remainingNumber">0</span>
      <span class="txt">to go</span>
    </div>
  </div>
  <div class="status-row">
    <span class="dot"></span>
    <span id="lastUpdated">Live — updated just now</span>
  </div>
</div>

<script>
  // ---- CONFIG ----------------------------------------------------
  const GOAL = 500; // confirmed Lakewood Chevrolet sales goal
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzaqxqQa4-LQR-1kSEAE5l1FdT_pnJZpJJhgoFL_pt3tSCNP9A3blww5lUvCyACmpQW/exec"; // e.g. https://script.google.com/macros/s/XXXX/exec
  const POLL_INTERVAL_MS = 5 * 60 * 1000; // 5 minutes — adjust as needed
  const DEMO_VALUE = 214; // shown until the Apps Script URL above is wired up
  // ------------------------------------------------------------------

  let currentCount = 0;

  const bigNumberEl = document.getElementById('bigNumber');
  const goalDisplayEl = document.getElementById('goalDisplay');
  const remainingEl = document.getElementById('remainingNumber');
  const progressFillEl = document.getElementById('progressFill');
  const lastUpdatedEl = document.getElementById('lastUpdated');

  goalDisplayEl.textContent = GOAL;
  remainingEl.textContent = GOAL;

  function animateCount(from, to, duration = 900) {
    const start = performance.now();
    function tick(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const value = Math.round(from + (to - from) * eased);
      bigNumberEl.textContent = value;
      remainingEl.textContent = Math.max(GOAL - value, 0);
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function updateProgressBar(count) {
    const clamped = Math.max(0, Math.min(count, GOAL));
    progressFillEl.style.width = (clamped / GOAL * 100) + "%";
  }

  function setCountValue(count) {
    const safeCount = Math.max(0, Math.min(Number(count) || 0, GOAL));
    animateCount(currentCount, safeCount);
    updateProgressBar(safeCount);
    currentCount = safeCount;
    lastUpdatedEl.textContent = "Live — updated " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  async function fetchLatestCount() {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.startsWith("PASTE_")) {
      // No endpoint configured yet — render demo value so the page is visible.
      setCountValue(DEMO_VALUE);
      lastUpdatedEl.textContent = "Demo data — connect Apps Script to go live";
      return;
    }
    try {
      const res = await fetch(APPS_SCRIPT_URL, { cache: "no-store" });
      const contentType = res.headers.get("content-type") || "";

      if (!contentType.includes("application/json")) {
        // Most common cause: deployment access isn't set to "Anyone",
        // so Google returns an HTML login page instead of JSON.
        lastUpdatedEl.textContent = "Endpoint returned non-JSON — check deployment access is set to \"Anyone\"";
        console.error("Expected JSON, got content-type:", contentType);
        return;
      }

      const data = await res.json();

      if (data.error) {
        lastUpdatedEl.textContent = "Script error: " + data.error;
        console.error("Apps Script returned an error:", data.error);
        return;
      }

      if (typeof data.sold !== "number" || isNaN(data.sold)) {
        lastUpdatedEl.textContent = "Unexpected response shape — check the cell reference in the script";
        console.error("Unexpected response:", data);
        return;
      }

      // Expects { sold: <number> } from the Apps Script endpoint.
      setCountValue(data.sold);
    } catch (err) {
      lastUpdatedEl.textContent = "Unable to refresh — showing last known value";
      console.error("Failed to fetch sheet value:", err);
    }
  }

  fetchLatestCount();
  setInterval(fetchLatestCount, POLL_INTERVAL_MS);
</script>

</body>
</html>
